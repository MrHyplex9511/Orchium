name: desktop-installers

on:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub release tag to upload installers to (e.g. v1.0.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cli:
    runs-on: ubuntu-latest
    env:
      ORCHIUM_CHANNEL: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Resolve version and release tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.release }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          TAG="${TAG#refs/tags/}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun

      - name: Build orchium TUI binaries and upload to release
        run: ./packages/orchium/script/build.ts
        env:
          ORCHIUM_VERSION: ${{ steps.version.outputs.release_version }}
          ORCHIUM_RELEASE: "true"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            platform_flag: --linux
            rust_target: x86_64-unknown-linux-gnu
          - host: windows-latest
            platform_flag: --win
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    env:
      ORCHIUM_CHANNEL: prod
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and release tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.release }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          TAG="${TAG#refs/tags/}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          ORCHIUM_VERSION: ${{ steps.version.outputs.release_version }}
          RUST_TARGET: ${{ matrix.settings.rust_target }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ORCHIUM_VERSION: ${{ steps.version.outputs.release_version }}

      - name: Package
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: packages/desktop/dist
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            FILES=(*.deb *.AppImage *.rpm)
          else
            FILES=(*.exe *.msi)
          fi
          if [ ${#FILES[@]} -eq 0 ] || [ ! -e "${FILES[0]}" ]; then
            echo "No installers produced in $(pwd):"
            ls -la
            exit 1
          fi
          gh release upload "${{ steps.version.outputs.release_tag }}" "${FILES[@]}" --clobber